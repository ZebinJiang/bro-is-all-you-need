name: AutoVLA

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "boundaries.txt"
      - "autovla/**"
      - "tests/core/**"
      - "tests/assets/**"
      - "tests/config/**"
      - "tests/data/**"
      - "tests/dataloader/**"
      - "tests/model/**"
      - "tests/training/**"
      - "tests/maintenance/**"
      - "tests/slurm/**"
      - ".codex/**"
      - "coordination/**"
      - "docs/autovla/**"
      - "docs/references/**"
      - "docs/coordination/**"
      - "docs/architecture/**"
      - "docs/validation/**"
      - "docs/migration/**"
      - ".agent-docs/**"
      - ".agents/**"
      - "scripts/quality/**"
      - "scripts/env/**"
      - "scripts/coordination/**"
      - "requirements/quality/**"
      - "requirements/ci/**"
      - "scripts/maintenance/**"
      - "scripts/slurm/**"
      - "scripts/runtime/**"
      - "configs/runtime/**"
      - "configs/slurm/**"
      - "configs/experiments/**"
      - "configs/env/**"
      - "configs/environments/**"
      - "configs/models/**"
      - "configs/training/**"
      - "configs/distributed/**"
      - "envs/**"
      - "pyrightconfig.autovla.json"
      - "Makefile"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/**"
      - "tests/meta/**"
  push:
    paths:
      - "AGENTS.md"
      - "boundaries.txt"
      - "autovla/**"
      - "tests/core/**"
      - "tests/assets/**"
      - "tests/config/**"
      - "tests/data/**"
      - "tests/dataloader/**"
      - "tests/model/**"
      - "tests/training/**"
      - "tests/maintenance/**"
      - "tests/slurm/**"
      - ".codex/**"
      - "coordination/**"
      - "docs/autovla/**"
      - "docs/references/**"
      - "docs/coordination/**"
      - "docs/architecture/**"
      - "docs/validation/**"
      - "docs/migration/**"
      - ".agent-docs/**"
      - ".agents/**"
      - "scripts/quality/**"
      - "scripts/env/**"
      - "scripts/coordination/**"
      - "requirements/quality/**"
      - "requirements/ci/**"
      - "scripts/maintenance/**"
      - "scripts/slurm/**"
      - "scripts/runtime/**"
      - "configs/runtime/**"
      - "configs/slurm/**"
      - "configs/experiments/**"
      - "configs/env/**"
      - "configs/environments/**"
      - "configs/models/**"
      - "configs/training/**"
      - "configs/distributed/**"
      - "envs/**"
      - "pyrightconfig.autovla.json"
      - "Makefile"
      - "pyproject.toml"
      - ".pre-commit-config.yaml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/**"
      - "tests/meta/**"

jobs:
  autovla-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Cache AutoVLA quality wheelhouse
        uses: actions/cache@v4
        with:
          path: |
            runs/tmp/GVLA-M2-TOOLENV-RECOVERY-001/wheelhouse
            runs/tmp/m1-tool-pip-cache
          key: autovla-quality-${{ runner.os }}-${{ runner.arch }}-py3.10-${{ hashFiles('requirements/quality/quality-requirements.txt', 'requirements/quality/quality-constraints.txt', 'pyproject.toml') }}
          restore-keys: |
            autovla-quality-${{ runner.os }}-${{ runner.arch }}-py3.10-
      - name: Fill AutoVLA project-local wheelhouse
        run: bash scripts/quality/bootstrap_project_local_tools.sh --fill-wheelhouse
      - name: Bootstrap AutoVLA project-local gate tools
        run: bash scripts/quality/bootstrap_project_local_tools.sh
      - name: Run architecture source and config advisory checks
        run: >-
          runs/tmp/m1-tool-venv/bin/python -m pytest -q
          tests/assets
          tests/config/test_gpu_deepspeed_config.py
          tests/config/test_env_profiles.py
          tests/config/test_package_metadata.py
          tests/config/test_packaged_resources.py
          tests/data
          tests/meta/test_repo_policy.py
          tests/slurm/test_m8_a100_architecture_smoke.py
      - name: Run AutoVLA governance gate
        run: make governance-check
      - name: Run staged model-asset advisory scan
        run: runs/tmp/m1-tool-venv/bin/python scripts/quality/check_staged_model_assets.py
