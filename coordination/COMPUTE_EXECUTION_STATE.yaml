compute_execution_state_schema_version: 1
source_doc: docs/coordination/COMPUTE_EXECUTION_GOVERNANCE.md
model_routing_policy: coordination/MODEL_ROUTING_POLICY.yaml
validation_policy: coordination/VALIDATION_POLICY.yaml
active_model_label: gpt-5.6-sol
owner_model_label: gpt-5.6-sol
owner_execution_reasoning: high
president_manager_model_label: gpt-5.6-sol
manager_return_model_label: gpt-5.6-sol
execution_reasoning: high
president_manager_reasoning: ultra
manager_return_reasoning: ultra
same_thread_return_override: not_required
return_synthesizer_fallback: false
max_default: false
max_forbidden: false
default_posture: governance_only
governance_resource_defaults_allowed: false
login_node_allowed:
  - file_inspection
  - yaml_json_parse
  - python_syntax_check
  - drift_scan
  - git_diff_check
login_node_forbidden_by_default:
  - full_pytest
  - package_build
  - wheel_install
  - dataset_conversion
  - training
  - evaluation
  - inference
  - heavy_validation
compute_command_classification:
  required: true
  unknown_requires_compute_hpc_owner: true
  heavy_validation_requires_compute_hpc_owner: true
  heavy_validation_on_login_node_allowed_default: false
  blocker_status: BLOCKED_COMPUTE_ROUTE
requires_explicit_authorization:
  - training
  - evaluation
  - dataset_conversion
  - inference_serving
  - gpu_execution
  - slurm_submission
  - dependency_change
failure_classes:
  missing_or_ambiguous_compute_authorization: BLOCKED_COMPUTE_AUTH
  missing_or_unresolved_compute_environment: BLOCKED_COMPUTE_ENV
  scheduler_policy_conflict_or_rejection: BLOCKED_COMPUTE_POLICY
top_level_compute_authorization_fields:
  - compute_authorized
  - authorized_actions
  - purpose
  - command_or_wrapper
  - execution_location
  - resource_class
  - resource_source
  - evidence_path
  - safety_stop_condition
  - expected_output
  - rollback_or_cleanup_note
  - authorizing_prompt_or_task
  - slurm_authorized
  - escalation_authorized
  - scheduler_policy_ack
  - scheduler_rejection_status
slurm_command_gate:
  requires_compute_authorization: true
  requires_slurm_authorization: true
  requires_project_wrapper: true
  dry_run_is_not_acceptance: true
  raw_command_exception_requires_user_prompt: true
escalation_authorization:
  separate_from_compute_authorization: true
  separate_from_slurm_authorization: true
  sandbox_escalation_does_not_authorize_scheduler_mutation: true
scheduler_policy:
  bypass_allowed: false
  cgroup_or_accounting_bypass_allowed: false
  scheduler_rejection_hard_stop: true
  rejection_status: BLOCKED_COMPUTE_POLICY
  environment_rejection_status: BLOCKED_COMPUTE_ENV
slurm_escalation_memory:
  sandbox_or_env_wrapper_retry: SLURM_SANDBOX_OR_ENV_WRAPPER_RETRY_WITH_ESCALATION
  policy_rejection_stop: SLURM_POLICY_REJECTION_STOP_DO_NOT_BYPASS
  raw_srun_sbatch_without_compute_owner_status: BLOCKED_COMPUTE_ROUTE
git_lfs_locksverify_policy:
  candidate_memory_id: GIT_LFS_LOCKSVERIFY_PROXY_TIMEOUT_CANDIDATE
  candidate_only: true
  default_disable_allowed: false
  canonical_disable_allowed: false
  one_off_retry_requires_task_authorization: true
current_task:
  task_id: AUTOVLA-M12-ARCHITECTURE-FIRST-RUNTIME-SUBSTRATE-OFFICIAL-FAMILY-ACTIVATION-001
  compute_authorized: true
  authorized_actions:
    - official_family_single_gpu_bringup
    - pinned_upstream_oracle
    - real_backend_binding_validation
    - same_node_ddp
    - deepspeed_zero1
    - deepspeed_zero2
    - deepspeed_zero3
    - cross_node_ddp
    - cross_node_zero3
    - checkpoint_load_save_fresh_process_resume
    - bounded_profiling
  purpose: m12_official_family_runtime_and_distributed_validation
  command_or_wrapper: task-approved project Slurm wrappers after asset, license, terms, environment, and data-binding gates
  execution_location: slurm_compute_nodes_via_project_wrapper
  resource_class: bounded_a100_official_family_runtime
  resource_source: a100 partition within the prompt-supplied submission and GPU-hour ceilings
  evidence_path: runs/slurm/AUTOVLA-M12-ARCHITECTURE-FIRST-RUNTIME-SUBSTRATE-OFFICIAL-FAMILY-ACTIVATION-001-*/
  safety_stop_condition: >-
    unresolved asset access or redistribution terms, missing exact environment
    receipt, missing semantic data binding, scheduler rejection, wrapper policy
    failure, timeout, hidden network or download attempt, non-finite loss or
    gradients, rank failure, process-group or worker leak, CPU model placement,
    FSDP activation, or work beyond the bounded M12 envelope
  expected_output: exact-SHA single-GPU, oracle, backend, DDP, DeepSpeed, cross-node, checkpoint-resume, and profiler receipts
  rollback_or_cleanup_note: project wrappers terminate child ranks and workers; generated outputs remain ignored and are not deleted without separate cleanup authorization
  authorizing_prompt_or_task: AUTOVLA-M12-ARCHITECTURE-FIRST-RUNTIME-SUBSTRATE-OFFICIAL-FAMILY-ACTIVATION-001
  heavy_validation_authorized: true
  slurm_authorized: true
  gpu_authorized: true
  cpu_model_runtime_authorized: false
  fsdp_or_fsdp2_authorized: false
  escalation_authorized: true
  scheduler_policy_ack: use only approved filled configs and project wrappers; scheduler rejection is a hard stop
  scheduler_rejection_status: BLOCKED_COMPUTE_POLICY
  missing_authorization_status: BLOCKED_COMPUTE_AUTH
  missing_environment_status: BLOCKED_COMPUTE_ENV
  maximum_total_slurm_submissions: 128
  maximum_total_a100_gpu_hours: 1024
  maximum_active_a100_jobs: 8
  submissions_used: 0
  a100_gpu_hours_used: 0
  active_compute_agents: 0
  status: authorized_but_not_dispatched_external_asset_license_terms_and_binding_gates
  publication_runtime_evidence_status: static_source_and_contract_only_no_compute_receipts
  terminal_or_handed_off_jobs: none_submitted
  draft_publication_nonclaim: >-
    no checkpoint load, CUDA construction, optimizer step, DDP, ZeRO,
    cross-node, real-backend, or profiling runtime was executed
  first_causal_gates:
    gr00t_n1d6: ASSET_ACCESS_RECEIPT_MISSING
    gr00t_n1d7: GR00T_N1D7_CHECKPOINT_LICENSE_CONFLICT_UNRESOLVED
    pi0_5: PI05_CHECKPOINT_AND_GEMMA_TERMS_RECEIPT_MISSING
