thread_registry_schema_version: 2
project: AutoVLA
engineering_base: StarVLA
workspace: <repo-root>
registry_publication_mode: prompt_scoped_ephemeral_template
status: m10_prompt_scoped_active
startup_smoke_status: not_applicable_persistent_owners_disabled

governance:
  active_governance: docs/coordination/CODEX_MANAGER_GOVERNANCE.md
  model_routing_policy: coordination/MODEL_ROUTING_POLICY.yaml
  lifecycle_policy: coordination/AGENT_LIFECYCLE_POLICY.yaml
  parallel_execution_policy: coordination/PARALLEL_EXECUTION_POLICY.yaml
  validation_policy: coordination/VALIDATION_POLICY.yaml
  president_manager_model_label: gpt-5.6-sol
  president_manager_reasoning: max
  child_model_label: gpt-5.6-sol
  child_execution_reasoning: medium
  child_return_reasoning: medium
  inherit_parent_model: false
  inherit_parent_reasoning: false
  persistent_owner_threads_enabled: false
  automatic_owner_fanout_enabled: false
  manager_only_integration_and_publication: true
  root_claude_md_is_legacy_only: true

manager:
  name: "00-MANAGER · AutoVLA Program"
  thread_id: <manager-thread-id-redacted>
  role: president_manager
  archived: false

persistent_owners:
  enabled: false
  archived_by_startup_sanitation: true
  dispatch_allowed: false
  entries: []

active_children: []

child_template:
  agent_id: <ephemeral-child-id>
  role: <prompt-defined-role>
  wave: <prompt-defined-wave>
  model: gpt-5.6-sol
  reasoning: medium
  return_reasoning: medium
  inherit_parent_model: false
  inherit_parent_reasoning: false
  source_sha: <exact-source-sha>
  worktree: <isolated-worktree-or-read-only-root>
  branch: <isolated-child-branch-or-none>
  owned_paths: []
  forbidden_paths: []
  evidence_root: <runs-tmp-agent-root>
  expected_handoff: <handoff-path>
  expected_commit_or_no_commit: <commit-or-none>
  close_condition: <explicit-close-condition>
  terminal_status: <active-or-closed>

runtime_state_policy:
  real_child_ids: keep in ignored task-local lifecycle ledger only
  local_absolute_worktree_paths: keep in ignored task-local lifecycle ledger only
  completed_children: remove from active_children immediately
  historical_persistent_owner_records: retain in Git history only
