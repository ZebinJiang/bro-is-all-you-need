status: executing
objective: >
  Build a shared bounded sample/window manifest over the read-only ZJH LeRobot
  v2.1 source dataset, compare raw/v3/WebDataset/RoboDM-style candidate stores
  with numeric load metrics, run governed GR00T-N1D6 200-step GPU telemetry for
  runnable candidates, update README/docs benchmark tables, and publish the
  result as a draft PR without merging.
