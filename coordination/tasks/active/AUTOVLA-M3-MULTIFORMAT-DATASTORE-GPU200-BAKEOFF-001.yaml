notes:
  - Only `datasets/working/autovla_multiformat_bakeoff_gpu200/**` is approved for generated working artifacts in this task.
  - All other paths under `datasets/working/**` remain protected.
  - Only task-owned Slurm and debug evidence under `runs/slurm/autovla-m3-multiformat-*` and `runs/slurm_debug/autovla-m3-multiformat-*` is approved in this task.
  - Unrelated `runs/slurm/**` and `runs/slurm_debug/**` artifacts remain out of scope.
acceptance_criteria:
  - All four mandatory candidates appear in numeric JSON/CSV/Markdown/README tables.
  - Shared sample/window manifest is deterministic and used across candidates.
  - Raw source dataset remains unchanged and generated artifacts are not committed.
  - GR00T-N1D6 checkpoint path is governed read-only and no network download occurs.
  - README and docs/benchmarks summarize numeric results without raw logs.
  - Draft PR is created or connector-action-ready with exact blocker evidence.
required_commands:
  - git status --short --branch
  - git diff --check
  - focused pytest on tiny fixtures
  - py_compile changed python files
  - real compute-node store benchmark
  - real 1-GPU 200-step telemetry on runnable candidates
  - scan checks before commit/push/draft PR
breaking_change: false
user_decision_required: true
