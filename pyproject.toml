[build-system]
requires = ["setuptools==77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "autovla"
description = "AutoVLA infrastructure for governed vision-language-action data, models, and training."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["vision-language-action", "robot learning", "multimodal training"]
license = "MIT AND Apache-2.0 AND LicenseRef-NVIDIA-Isaac-GR00T-N1D6"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "omegaconf",
]

[project.urls]
Repository = "https://github.com/ZebinJiang/bro-is-all-you-need"
Issues = "https://github.com/ZebinJiang/bro-is-all-you-need/issues"

[project.optional-dependencies]
dev = [
    "black>=24.2.0",
    "build>=1.2.2",
    "gpustat",
    "ipython",
    "pre-commit",
    "pytest",
    "pyright",
    "ruff>=0.2.2",
    "tomli>=2; python_version < '3.11'",
]
training = ["torch>=2.5,<2.7"]
training-deepspeed = ["deepspeed==0.19.2"]
asset-acquisition = ["huggingface_hub==0.30.2"]
model-gr00t-n1d6 = [
    "pillow>=10,<12",
    "safetensors>=0.4,<0.6",
    "torch==2.7.1",
    "torchvision>=0.20,<0.22",
    "transformers>=4.51.3,<4.52",
]
data-lerobot = ["av>=16,<17", "pillow>=10,<12", "pyarrow>=14,<20"]
data-webdataset = ["webdataset==1.0.2"]
perf = ["webdataset==1.0.2"]

[project.scripts]
autovla-train = "autovla.cli.train:main"
autovla-inspect-config = "autovla.cli.inspect_config:main"
autovla-assets = "autovla.cli.assets:main"
autovla-env = "autovla.cli.env:main"
autovla-models = "autovla.cli.models:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["runs", "envs", "base_model", "examples", ".venv", "venv", "build", "dist"]

[tool.setuptools.dynamic]
version = {attr = "autovla._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["autovla", "autovla.*"]

[tool.setuptools.package-data]
"autovla" = ["py.typed", "resources/**/*.yaml", "resources/**/*.txt", "resources/**/*.md"]

[tool.black]
line-length = 100
target-version = ["py310"]
preview = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "RUF", "W"]
ignore = ["F722"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
