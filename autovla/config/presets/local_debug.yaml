schema_version: "1.0"
name: local_debug
seed: 7
model:
  schema_version: "1.0"
  name: debug-model
  registry_key: debug-model
data:
  schema_version: "1.0"
  name: local-debug-data
  root: datasets/working/local_debug
  required_modalities:
    - front
  datasets:
    - name: local-debug-data
      backend: robodm_container
      root: datasets/working/local_debug
      split: train
      access_mode: map
      sample_count: 1
      image_keys:
        - front
runner:
  schema_version: "1.0"
  backend: local
  batch_size: 1
  max_steps: 1
  device: cpu
