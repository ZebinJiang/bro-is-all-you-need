defaults:
  - environments: a100
  - data: lerobot_local
  - model: gr00t_n1d6
  - training: single_gpu
  - optimization: adamw_cosine
run:
  name: m9_gr00t_gpu_architecture
  seed: 7
  output_dir: runs/local/m9_gr00t_gpu_architecture
  intent: architecture_inspection
transforms:
  plan_fingerprint: shared_r3_transform_plan
  statistics_fingerprint: local_lerobot_statistics
inference:
  enabled: false
  device: cuda
  precision: bfloat16
  local_only: true
deployment:
  enabled: false
  timeout: 30.0
